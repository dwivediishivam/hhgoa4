<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SentinelGraph — Fraud Investigation</title>
  <style>
    :root{--bg:#08111f;--panel:#101d31;--line:#263957;--text:#eef5ff;--muted:#9cb0cd;--blue:#4ca9ff;--red:#ff6e7d;--green:#4fdbac;--amber:#ffca62}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,sans-serif}header{height:68px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--line);background:#0b1627}h1{font-size:18px;margin:0}header span{color:var(--blue)}.sub{margin-left:16px;color:var(--muted);font-size:12px}.shell{display:grid;grid-template-columns:360px 1fr;min-height:calc(100vh - 68px)}aside{border-right:1px solid var(--line);padding:16px;overflow:auto}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}.metric div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:11px;color:var(--muted)}.metric b{display:block;font-size:18px;color:var(--text);margin-top:4px}.case{display:flex;justify-content:space-between;cursor:pointer;padding:12px 10px;border-bottom:1px solid var(--line)}.case:hover,.case.selected{background:#152842}.case small{display:block;color:var(--muted);margin-top:4px}.badge{align-self:start;padding:3px 7px;border-radius:99px;font-size:11px;background:#273954;color:var(--muted)}.fraud{color:var(--red)}.legitimate{color:var(--green)}main{padding:28px;max-width:1100px}.empty{color:var(--muted);padding:80px 0;text-align:center}.top{display:flex;justify-content:space-between;align-items:flex-start}.top h2{margin:0;font-size:25px}.score{font-size:30px;color:var(--amber)}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}.panel h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}.panel p{line-height:1.55;color:#d9e6fa}.evidence{border-left:2px solid var(--blue);padding:8px 12px;margin:10px 0;color:#d9e6fa;line-height:1.45}.evidence em{color:var(--muted);font-style:normal;font-size:12px}.actions{margin:0;padding:0;list-style:none}.actions li{border-top:1px solid var(--line);padding:10px 0}.route{float:right;color:var(--blue);font-size:12px}.reason{display:block;margin-top:5px;color:var(--muted);font-size:12px}code{color:var(--blue)}@media(max-width:800px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><header><h1>Sentinel<span>Graph</span></h1><div class="sub">Agentic Fraud Investigation • TigerGraph case memory</div></header><div class="shell"><aside><div class="metric" id="metrics"></div><div id="case-list"></div></aside><main id="detail"><div class="empty">Select an investigation to inspect its evidence, uncertainty, and policy-controlled actions.</div></main></div>
<script src="/config.js"></script><script>
const API_BASE=window.SENTINELGRAPH_API_URL||""; let all=[]; const money=x=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(x);
function renderList(){const fraud=all.filter(x=>x.verdict==='fraud').length, legit=all.filter(x=>x.verdict==='legitimate').length;document.querySelector('#metrics').innerHTML=`<div>Investigations<b>${all.length}</b></div><div>Fraud<b class="fraud">${fraud}</b></div><div>Cleared<b class="legitimate">${legit}</b></div>`;document.querySelector('#case-list').innerHTML=all.map(x=>`<div class="case" id="row-${x.case_id}" onclick="openCase('${x.case_id}')"><div><b>${x.case_id}</b><small>${x.pattern.replaceAll('_',' ')} · ${money(x.exposure_usd)}</small></div><span class="badge ${x.verdict}">${x.verdict}</span></div>`).join('')}
async function openCase(id){document.querySelectorAll('.case').forEach(x=>x.classList.remove('selected'));document.querySelector('#row-'+id).classList.add('selected');const d=await fetch(API_BASE+'/api/cases/'+id).then(r=>r.json()),c=d.case,acts=d.next_best_actions.final;document.querySelector('#detail').innerHTML=`<div class="top"><div><h2>${d.case_id}</h2><p>${c.summary}</p></div><div class="score">${Math.round(c.fraud_probability*100)}%<small style="display:block;color:var(--muted);font-size:11px;text-align:right">fraud probability</small></div></div><div class="grid"><section class="panel"><h3>Grounded evidence</h3>${c.evidence.map(e=>`<div class="evidence">${e.claim}<br><em>${e.source} · ${e.ref} · ${e.entity_ids.join(', ')}</em></div>`).join('')}</section><section class="panel"><h3>Final next-best actions</h3><ul class="actions">${acts.map(a=>`<li><b>${a.action}</b><span class="route">${a.route}</span><span class="reason">${a.reason}</span></li>`).join('')}</ul></section><section class="panel"><h3>Case progression</h3><p><b>Status:</b> ${c.status}<br><b>Pattern:</b> ${c.pattern.replaceAll('_',' ')}<br><b>Exposure:</b> ${money(c.exposure_usd)}<br><b>Graph case:</b> <code>${c.graph_case_id}</code></p><p>${d.stop_reason}</p></section><section class="panel"><h3>Evidence requests & memory</h3><p>${d.evidence_requests.length?d.evidence_requests.map(x=>`${x.type}: ${x.assumed_response}`).join('<br><br>'):'No additional evidence requested.'}</p><p><b>Similar closed cases:</b> ${c.similar_prior_cases.join(', ')||'None'}</p></section></div>`}
fetch(API_BASE+'/api/cases').then(r=>r.json()).then(x=>{all=x;renderList();if(all.length)openCase(all[0].case_id)})
</script></body></html>
